experiment:
  id: carla_semantic_demo
  type: carla_semantic_demo_mining
  output: outputs/carla_semantic_demo_trajectory_transformer_final
  result_path: outputs/carla_semantic_demo_trajectory_transformer_final/experiment_result.json

carla_semantic_demo:
  carla_root: external/carla/latest
  checkpoint: outputs/bench2drive_vision_e2e_trajectory_transformer_final/vision_e2e_planner_best.pt
  output: outputs/carla_semantic_demo_trajectory_transformer_final
  trials_output: outputs/carla_semantic_demo_trajectory_transformer_final_trials
  host: 127.0.0.1
  port_start: 2040
  traffic_manager_port_start: 8040
  town: Town10HD_Opt
  fps: 10
  horizon_s: 60.0
  image_size: 160
  camera_width: 640
  camera_height: 360
  video_width: 1920
  video_height: 1080
  camera_fov: 90.0
  carla_quality_level: Epic
  brake_threshold: 0.82
  device: cuda
  auto_launch: true
  cuda_visible_devices: ""
  launch_timeout_s: 180.0
  rpc_timeout_s: 90.0
  keep_server: false
  reuse_carla_server: false
  video_fps: 10
  video_encoder: hevc_nvenc
  video_nvenc_preset: p4
  video_quality: 23
  render_gif: false
  enable_scenario_safety_override: true
  enable_lane_departure_guard: false
  condition_ego_route_traffic_lights: true
  route_sampling_resolution_m: 2.0
  route_min_length_m: 55.0
  route_max_length_m: 160.0
  route_preferred_length_m: 95.0
  max_attempts_per_target: 4
  min_resolution_width: 1920
  min_resolution_height: 1080
  min_fps: 8.0
  min_frames: 80
  min_traffic_manager_vehicles: 1
  min_route_completion: 0.05
  max_mean_lateral_error_m: 2.5
  max_lateral_error_m: 6.0
  max_safety_override_ratio: 0.45
  max_nearest_actor_distance_m: 60.0
  nearby_actor_distance_m: 30.0
  min_nearby_actor_ratio: 0.30
