queries:
  - id: pedestrian_crossing_front
    description: pedestrian crossing in front of ego lane
    top_k: 3
    candidate_pool: 10
    tags: [vru, crossing, front]
    query:
      natural_language: pedestrian crossing in front of ego lane
      actors: [pedestrian]
      positions: [front]
      behaviors: [crossing]
      map_constraints:
        prefer_crosswalk: true
        prefer_walkway: true
      thresholds:
        near_distance_m: 25
        max_ttc_s: 6

  - id: pedestrian_crossing_tight_gap
