queries:
  - id: pedestrian_crossing_front
    description: pedestrian crossing in front of ego lane
    top_k: 3
    candidate_pool: 10
    tags:
      - vru
      - crossing
      - front
    query:
      natural_language: pedestrian crossing in front of ego lane
      actors:
        - pedestrian
      positions:
        - front
      behaviors:
        - crossing
      map_constraints:
        prefer_crosswalk: true
        prefer_walkway: true
      thresholds:
        near_distance_m: 25
        max_ttc_s: 6

  - id: stopped_lead_vehicle
    description: stopped lead vehicle blocking ego
    top_k: 3
    candidate_pool: 10
    tags:
      - stopped
      - lead
      - lane_blocking
    query:
      natural_language: stopped lead vehicle blocking ego
      actors:
        - vehicle
      positions:
        - front
      behaviors:
        - stopped_lead
      map_constraints:
        prefer_same_lane: true
      thresholds:
        near_distance_m: 25
        max_ttc_s: 6

  - id: oncoming_close_vehicle
    description: oncoming vehicle close to ego
    top_k: 3
    candidate_pool: 12
    tags:
      - oncoming
      - close
      - vehicle
    query:
      natural_language: oncoming vehicle close to ego
      actors:
        - vehicle
      positions:
        - front
      behaviors:
        - oncoming
      map_constraints:
        prefer_road_lane: true
      thresholds:
        near_distance_m: 20
        max_ttc_s: 5

  - id: right_side_cut_in
    description: vehicle cuts in from right side
    top_k: 3
    candidate_pool: 12
    tags:
      - cutin
      - merge
      - right
    query:
      natural_language: vehicle cuts in from right side
      actors:
        - vehicle
      positions:
        - right
      behaviors:
        - cut_in
      map_constraints:
        prefer_lane_merge: true
      thresholds:
        near_distance_m: 25
        max_ttc_s: 6
