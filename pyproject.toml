[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuscenes-scene-agent"
version = "0.1.0"
description = "Toolkit for natural-language scene retrieval, validation, benchmark generation, and replay regression on nuScenes and nuPlan."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["nuScenes", "nuPlan", "autonomous driving", "scene mining", "risk retrieval", "benchmark generation", "replay regression", "corner case mining"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "nuscenes-devkit>=1.1.11",
  "numpy>=1.22",
  "pandas>=1.5",
  "matplotlib>=3.5",
  "jinja2>=2.10",
  "PyYAML>=5.3",
  "shapely>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
agent = [
  "langgraph>=1.1,<2; python_version >= '3.10'",
]
learned = [
  "torch>=2.5",
]
forecast = [
  "torch>=2.5",
  "torchvision>=0.20",
  "scikit-learn>=1.3",
]
ros = [
  "mcap>=1.1",
]

[project.scripts]
nuscenes-scene-agent = "nusc_scene_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
